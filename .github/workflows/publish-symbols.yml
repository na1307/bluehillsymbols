name: Publish Symbols

on:
  workflow_call:
    inputs:
      artifact_id:
        required: true
        type: number
      product_name:
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      version:
        required: false
        type: string
        default: ${{ github.ref_name }}

jobs:
  publish:
    name: Publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo ${{ github.ref_name }}
      - run: "& \"C:\\Program Files (x86)\\Windows Kits\\10\\Debuggers\\x64\\symstore.exe\""
