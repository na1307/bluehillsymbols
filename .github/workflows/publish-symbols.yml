name: Publish Symbols

on:
  workflow_dispatch:
    inputs:
      repository:
        required: true
        type: string
      run_id:
        required: true
        type: number
      artifact_name:
        required: true
        type: string
      product_name:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  publish:
    name: Publish Symbols
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Download
        run: gcloud storage rsync gs://symbols.bluehill.dev _working --recursive
      - run: mv 000Admin _working
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          repository: ${{ inputs.repository }}
          run-id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          path: _artifact
          github-token: ${{ secrets.BS_PAT }}
      - run: "& \"C:\\Program Files (x86)\\Windows Kits\\10\\Debuggers\\x64\\symstore.exe\" add /r /o /compress /f _artifact\\*.pdb /s _working /t ${{ inputs.product_name }} /v ${{ inputs.version }}"
      - run: mv _working\000Admin .
      - name: Upload
        run: gcloud storage rsync _working gs://symbols.bluehill.dev --recursive --no-ignore-symlinks
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 000Admin
          git commit -m "chore: Update Logs [skip ci]"
          git push
